[project]
name = "dvpn-agent"
version = "0.1.0"
description = "DeutschlandVPN – privilegierter WireGuard-Agent (nur Standardbibliothek)"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
dvpn-agent = "dvpn_agent.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["dvpn_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
